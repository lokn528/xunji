<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>循迹</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 兜底：直接双击打开 dist/index.html（file:// 协议）时，ES module 会被
      // 浏览器的 CORS 规则拦掉，页面会一片空白。检测到模块没跑起来就给出说明，
      // 而不是让人对着白屏猜。在 Tauri 里模块立刻渲染，不会触发。
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:#f2efe6;color:#16130f;font-family:system-ui,-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif">' +
          '<div style="max-width:620px;background:#fffdf7;border:2px solid #16130f;border-radius:10px;padding:30px 34px">' +
          '<h1 style="margin:0;font-size:26px;letter-spacing:.08em">循迹</h1>' +
          '<p style="margin:4px 0 20px;color:#6d675e;font-size:13px">所有丢过的东西，有迹可循</p>' +
          '<div style="border:2px solid #d97706;background:#fdf0d5;border-radius:10px;padding:14px 16px">' +
          '<strong style="display:block;margin-bottom:5px;color:#d97706">这是桌面应用，不是网页。</strong>' +
          '<p style="margin:0;font-size:13px;line-height:1.65">循迹把卡片存在本机 SQLite，文件操作与 AI 密钥都放在 Rust 侧处理，浏览器里跑不起来。</p></div>' +
          '<h2 style="margin:22px 0 8px;font-size:14px">怎么打开</h2>' +
          '<ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.9">' +
          '<li>直接运行 <code style="font-family:Consolas,monospace;font-size:12px">src-tauri\\target\\release\\xunji.exe</code></li>' +
          '<li>或在项目目录执行 <code style="font-family:Consolas,monospace;font-size:12px">npm run tauri dev</code></li></ol>' +
          '</div></div>';
      }, 1200);
    </script>
  </body>
</html>
